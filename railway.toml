[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Free plan requires this (dashboard: Settings → Deploy → Serverless).
sleepApplication = true
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Attach a Railway Volume mounted at /data in the dashboard.
# Env: DHAN_CLIENT_ID, DHAN_PIN, DHAN_TOTP_SECRET, DHAN_API_BASE, DATA_DIR=/data
